[workspace]
resolver = "2"
members = [
    "crates/timemachine-core",
    "crates/timemachine-cli",
    "crates/timemachine-bench",
    "bindings/c",
    "bindings/python",
    "bindings/node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wickra-lib/wickra-timemachine"
authors = ["wickra-lib"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
thiserror = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }
# Wickra ecosystem. `wickra-core` ships on crates.io; the exchange feeds and the
# backtest replay engine are consumed as git dependencies (version-pinned so
# cargo-deny does not flag a wildcard) until their first crates.io release.
wickra-core = "0.9"
wickra-exchange-core = { git = "https://github.com/wickra-lib/wickra-exchange", version = "0.1" }
wickra-exchange = { git = "https://github.com/wickra-lib/wickra-exchange", version = "0.1" }
wickra-backtest = { git = "https://github.com/wickra-lib/wickra-backtest", version = "0.1" }
cbindgen = "0.27"
criterion = "0.8"
proptest = "1"
wasm-bindgen = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
