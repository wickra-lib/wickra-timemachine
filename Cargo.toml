[workspace]
resolver = "2"
# cargo-fuzz builds this crate on its own, with sanitizer flags the workspace
# must not inherit, so it is not a member.
exclude = ["fuzz"]
members = [
    "crates/timemachine-core",
    "crates/timemachine-cli",
    "crates/timemachine-bench",
    "bindings/c",
    "bindings/python",
    "bindings/node",
    "bindings/wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wickra-lib/wickra-timemachine"
authors = ["wickra-lib"]

[workspace.dependencies]
# Workspace-internal core, referenced by the CLI, bench and bindings.
wickra-timemachine-core = { version = "0.1.0", path = "crates/timemachine-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
thiserror = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }
# Wickra ecosystem, all of it from crates.io.
#
# `wickra-core` is held at the same major as the copy `wickra-backtest` resolves,
# so the tree carries one `wickra-core` and one set of indicator types rather
# than two that share none at all.
wickra-core = "1.0"
wickra-exchange-core = "0.1.3"
wickra-exchange = "0.1.3"
# The ecosystem's only name -> indicator factory: what lets a `TimelineSpec` name
# any registry indicator rather than the three this repository used to hardcode.
wickra-backtest = "0.1.4"
cbindgen = "0.27"
criterion = { package = "codspeed-criterion-compat", version = "5.0.1", features = ["html_reports"] }
proptest = "1"
wasm-bindgen = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
