[package]
name = "wickra-timemachine-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The core under test. Default features off so the fuzzers exercise the
# single-threaded path (no rayon).
timemachine-core = { path = "../crates/timemachine-core", default-features = false }

# Detach from the parent workspace — cargo-fuzz builds this crate on its own with
# sanitizer flags on a nightly toolchain.
[workspace]

[[bin]]
name = "spec_parse"
path = "fuzz_targets/spec_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "event_fold"
path = "fuzz_targets/event_fold.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seek"
path = "fuzz_targets/seek.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command_json"
path = "fuzz_targets/command_json.rs"
test = false
doc = false
bench = false
