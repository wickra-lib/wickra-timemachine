[package]
name = "wickra-timemachine-python"
description = "Python bindings for wickra-timemachine: evolutionary strategy search over Wickra strategy specs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
publish = false

[lib]
name = "_wickra_timemachine"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
timemachine-core = { path = "../../crates/timemachine-core", version = "0.1" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
