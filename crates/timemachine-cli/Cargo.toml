[package]
name = "timemachine-cli"
description = "Command-line front end for the Wickra Time Machine — seek a recorded market universe to any past moment."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "wickra-timemachine"
path = "src/main.rs"

[package.metadata.docs.rs]
# Document every feature so an optional surface is not missing from the
# reference. docs.rs builds on nightly and sets the `docsrs` cfg, which is what
# makes the feature badges appear.
all-features = true

[dependencies]
timemachine-core = { path = "../timemachine-core", version = "0.1" }
clap = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
