[package]
name = "timemachine-core"
description = "Deterministic market time machine: reconstruct the full microstructure state of a whole crypto universe at any past moment via O(1) re-fold."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.docs.rs]
# Document every feature so an optional surface is not missing from the
# reference. docs.rs builds on nightly and sets the `docsrs` cfg, which is what
# makes the feature badges appear.
all-features = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rust_decimal = { workspace = true }
wickra-core = { workspace = true }
wickra-exchange-core = { workspace = true }
# The name -> indicator registry.
wickra-backtest = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
rust_decimal_macros = { workspace = true }

[features]
default = ["parallel"]
# The multi-symbol re-fold fans out across symbols with rayon. The single-threaded
# path (default features off, the WASM build) produces byte-identical snapshots.
parallel = ["dep:rayon"]

[lints]
workspace = true
